<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>For Mas Ipan ✦</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet"><style>*{  margin:0;  padding:0;  box-sizing:border-box;}html,body{  width:100%;  height:100%;  overflow:hidden;  font-family:'Poppins',sans-serif;  background:linear-gradient(180deg,#020b2d,#06164f,#020814);  color:white;}body{  position:relative;}.slides{  display:flex;  width:400vw;  height:100vh;  transition:transform .9s ease;}.slide{  width:100vw;  height:100vh;  flex-shrink:0;  display:flex;  flex-direction:column;  justify-content:center;  align-items:center;  position:relative;  overflow:hidden;  padding:20px;}/* GLASS */.glass{  background:rgba(255,255,255,.08);  backdrop-filter:blur(5px);  border:1px solid rgba(255,255,255,.08);  border-radius:35px;  box-shadow:    0 0 18px rgba(255,105,180,.14);  z-index:2;}/* BUTTON */.btn{  margin-top:22px;  padding:14px 34px;  border:none;  border-radius:999px;  background:    linear-gradient(      45deg,      #ff4fa3,      #7b8cff    );  color:white;  font-size:1rem;  font-weight:700;  cursor:pointer;  box-shadow:    0 0 14px rgba(255,105,180,.28);  animation:pulse 2.5s infinite;  z-index:5;}@keyframes pulse{  50%{    transform:scale(1.04);  }}/* TITLE */.title-script{  font-family:'Great Vibes',cursive;  font-size:clamp(3rem,10vw,5rem);  text-align:center;  color:#ff8fd2;  text-shadow:    0 0 12px rgba(255,105,180,.55);}/* SLIDE 1 */.gift{  font-size:5.5rem;  animation:floatGift 3s ease-in-out infinite;  color:#ff9ad5;}@keyframes floatGift{  50%{    transform:translateY(-10px);  }}.hearts span{  position:absolute;  color:#ff69b4;  animation:floatUp linear infinite;  opacity:.7;  text-shadow:    0 0 6px rgba(255,105,180,.55);}@keyframes floatUp{  from{    transform:translateY(110vh);  }  to{    transform:translateY(-20vh);  }}/* SLIDE 2 */.dots{  display:flex;  gap:12px;  margin:20px;  justify-content:center;}.dot{  width:18px;  height:18px;  border:2px solid pink;  border-radius:50%;}.dot.fill{  background:pink;  box-shadow:    0 0 8px pink;}.keypad{  display:grid;  grid-template-columns:repeat(3,80px);  gap:14px;  justify-content:center;}.key{  height:72px;  border:none;  border-radius:22px;  background:    linear-gradient(      145deg,      rgba(255,79,163,.85),      rgba(123,140,255,.75)    );  color:white;  font-size:1.5rem;  font-weight:700;  box-shadow:    0 0 8px rgba(255,105,180,.18);}.key:active{  transform:scale(.95);}/* RAIN */.tiktok-rain{  position:absolute;  inset:0;  overflow:hidden;  z-index:0;}.tiktok-line{  position:absolute;  top:-30%;  width:2px;  border-radius:999px;  background:    linear-gradient(      transparent,      rgba(255,105,180,.75),      transparent    );  box-shadow:    0 0 6px rgba(255,105,180,.4);  animation:tiktokFall linear infinite;}@keyframes tiktokFall{  to{    transform:translateY(180vh);  }}/* SLIDE 3 */.heart-wrap{  position:relative;  width:280px;  height:280px;  display:flex;  justify-content:center;  align-items:center;  z-index:2;}.heart{  position:relative;  width:100%;  height:100%;  animation:spinHeart 22s linear infinite;}.heart span{  position:absolute;  left:50%;  top:50%;  transform-origin:0 0;  color:#ff8fd2;  font-size:14px;  font-weight:600;  text-shadow:    0 0 5px rgba(255,105,180,.7);  white-space:nowrap;}@keyframes spinHeart{  from{    transform:rotate(0deg);  }  to{    transform:rotate(360deg);  }}/* FINAL SLIDE */.final-slide{  background:    radial-gradient(      circle at top,      #32215f 0%,      #10132d 40%,      #050510 100%    );}/* NEON BG */.neon-bg{  position:absolute;  inset:0;  overflow:hidden;  z-index:0;  transform:rotate(-8deg);}/* NEON TEXT */.neon-text{  position:absolute;  white-space:nowrap;  font-family:'Great Vibes',cursive;  font-size:clamp(2rem,4vw,4rem);  font-weight:300;  letter-spacing:1px;  color:#ff9ae6;  opacity:.72;  text-shadow:    0 0 4px #ff4fc3,    0 0 10px #ff4fc3;  animation:floatNeon 12s linear infinite;}@keyframes floatNeon{  from{    transform:translateX(-120px);  }  to{    transform:translateX(120px);  }}/* CAKE */.cake{  position:relative;  width:220px;  height:220px;  margin-bottom:25px;  animation:floatCake 3s ease-in-out infinite;  z-index:2;}@keyframes floatCake{  50%{    transform:translateY(-8px);  }}.plate{  position:absolute;  bottom:0;  left:20px;  width:180px;  height:18px;  background:    rgba(255,182,193,.45);  border-radius:50%;}.layer1{  position:absolute;  bottom:18px;  left:30px;  width:160px;  height:105px;  background:    linear-gradient(      180deg,      #ffe0f0,      #ffc1dc,      #ff9ecb    );  border-radius:22px 22px 38px 38px;}.cream1{  position:absolute;  bottom:102px;  left:30px;  width:160px;  height:28px;  background:#ff69b4;  border-radius:20px;}.face-eye{  position:absolute;  width:10px;  height:10px;  background:#2d1b3d;  border-radius:50%;  bottom:58px;}.eye1{  left:82px;}.eye2{  left:128px;}.face-smile{  position:absolute;  width:28px;  height:14px;  border-bottom:4px solid #2d1b3d;  border-radius:0 0 20px 20px;  left:96px;  bottom:42px;}.candle{  position:absolute;  width:18px;  height:58px;  left:101px;  bottom:125px;  border-radius:10px;  background:    repeating-linear-gradient(      45deg,      #ff4fa3 0 8px,      #fff 8px 16px    );}.flame{  position:absolute;  width:18px;  height:28px;  left:101px;  bottom:178px;  background:    radial-gradient(      circle,      #ffd54f 20%,      #ff9800 70%    );  border-radius:50%;  box-shadow:    0 0 12px gold;  animation:flicker 1s infinite alternate;}@keyframes flicker{  to{    transform:scale(1.08);  }}/* MESSAGE */.message{  max-width:92%;  padding:24px;  line-height:1.8;  text-align:center;  font-size:clamp(1.6rem,5vw,2.3rem);  font-family:'Great Vibes',cursive;  border-radius:45px;  box-shadow:    0 0 12px rgba(255,105,180,.18);  text-shadow:    0 0 8px rgba(255,105,180,.45);  z-index:2;}</style></head><body>  <audio id="bgMusic" loop>  <source src="lagu.mp3" type="audio/mpeg">  </audio><div class="slides" id="slides"><!-- SLIDE 1 --><section class="slide">  <div class="hearts" id="hearts"></div>  <div class="glass"       style="padding:35px;max-width:360px;text-align:center;">    <div class="gift">🌑</div>    <h1 class="title-script">      I have something for Mas Ipan    </h1>    <button class="btn"            onclick="nextSlide()">      Buka    </button>  </div></section><!-- SLIDE 2 --><section class="slide">  <div class="glass"       style="padding:30px;text-align:center;">    <h2 style="      color:#ff9ad5;      font-family:'Great Vibes',cursive;      font-size:clamp(2.5rem,8vw,4rem);      text-shadow:0 0 12px rgba(255,105,180,.5);    ">      kode nya 1405 ya mas Ipan ✦    </h2>    <div class="dots" id="dots"></div>    <div class="keypad" id="keys"></div>  </div></section><!-- SLIDE 3 --><section class="slide">  <div class="tiktok-rain" id="heartRain"></div>  <div class="heart-wrap">    <div class="heart" id="heart"></div>  </div>  <button class="btn"          onclick="nextSlide()">    Lanjut  </button></section><!-- SLIDE 4 --><section class="slide final-slide">  <div class="neon-bg" id="neonBg"></div>  <div class="cake">    <div class="plate"></div>    <div class="layer1"></div>    <div class="cream1"></div>    <div class="face-eye eye1"></div>    <div class="face-eye eye2"></div>    <div class="face-smile"></div>    <div class="candle"></div>    <div class="flame"></div>  </div>  <div class="glass message">    Barakallah fii umrik mas Ipan ✦    <br><br>    Udah naik level ke 23 tahun nih xixi    <br>    Semoga mas Ipan selalu dikelilingi hal-hal baik,    sehat selalu,    makin bahagia,    dilancarkan rezekinya,    dan tetap jadi mas Ipan yang baik dan keren ✨  </div></section></div><script>let current = 0;function nextSlide(){  if(current < 3){    current++;    document.getElementById("slides").style.transform =      `translateX(-${current * 100}vw)`;  }}/* SLIDE 1 */for(let i=0;i<14;i++){  const h =    document.createElement("span");  h.innerHTML = "✦";  h.style.left =    Math.random()*100 + "vw";  h.style.fontSize =    (14 + Math.random()*12) + "px";  h.style.animationDuration =    (6 + Math.random()*4) + "s";  document    .getElementById("hearts")    .appendChild(h);}/* SLIDE 2 */const correctCode = "1405";let input = "";for(let i=0;i<4;i++){  const d =    document.createElement("div");  d.className = "dot";  document    .getElementById("dots")    .appendChild(d);}[1,2,3,4,5,6,7,8,9,"",0].forEach(num=>{  const key =    document.createElement("button");  key.className = "key";  if(num === ""){    key.style.visibility = "hidden";  }else{    key.textContent = num;    key.onclick = ()=>{      if(input.length < 4){        input += num;        document          .querySelectorAll(".dot")          [input.length-1]          .classList.add("fill");        if(input.length === 4){          setTimeout(()=>{            if(input === correctCode){              nextSlide();            }else{              alert("kode nya salah yaa xixi");              input = "";              document                .querySelectorAll(".dot")                .forEach(dot=>                  dot.classList.remove("fill")                );            }          },250);        }      }    };  }  document    .getElementById("keys")    .appendChild(key);});/* SLIDE 3 HEART */const heart =  document.getElementById("heart");const heart = document.getElementById("heart");const text = "HAPPY BIRTHDAY  ";const points = 90;const spans = [];for(let i = 0; i < points; i++){  const span = document.createElement("span");  span.innerText = text;  span.style.position = "absolute";  span.style.left = "50%";  span.style.top = "50%";  span.style.fontSize = "14px";  span.style.fontWeight = "600";  span.style.color = "#ff8fd2";  span.style.whiteSpace = "nowrap";  span.style.textShadow = "0 0 8px rgba(255,105,180,.7)";  heart.appendChild(span);  spans.push(span);}// animasi jalan terus (biar hidup & orbit halus)function animateHeart(){  spans.forEach((el, i) => {    const t = (Math.PI * 2 * i) / points;    const x =      16 * Math.pow(Math.sin(t), 3);    const y =      -(13 * Math.cos(t)      - 5 * Math.cos(2 * t)      - 2 * Math.cos(3 * t)      - Math.cos(4 * t));    // arah sejajar + gak tabrakan    const offset = i * 0.05;    const moveX = Math.cos(Date.now()/900 + offset) * 4;    const moveY = Math.sin(Date.now()/900 + offset) * 4;    el.style.transform =      `translate(${x * 9 + moveX}px, ${y * 9 + moveY}px)`;  });  requestAnimationFrame(animateHeart);}animateHeart();  const t =    (Math.PI * 2 * i) / points;  const x =    16 * Math.pow(Math.sin(t),3);  const y =    -(      13*Math.cos(t)      - 5*Math.cos(2*t)      - 2*Math.cos(3*t)      - Math.cos(4*t)    );  const span =    document.createElement("span");  span.innerText = text;  const posX = x * 9;  const posY = y * 9;  span.style.transform = `    translate(${posX}px, ${posY}px)    rotate(${t}rad)  `;  heart.appendChild(span);}/* SLIDE 3 RAIN */for(let i=0;i<18;i++){  const line =    document.createElement("div");  line.className = "tiktok-line";  line.style.left =    Math.random()*100 + "vw";  line.style.height =    (160 + Math.random()*180) + "px";  line.style.animationDuration =    (1.8 + Math.random()*1.2) + "s";  line.style.animationDelay =    Math.random()*3 + "s";  document    .getElementById("heartRain")    .appendChild(line);}/* SLIDE 4 NEON */const neonBg =  document.getElementById("neonBg");for(let i=0;i<18;i++){  const text =    document.createElement("div");  text.className = "neon-text";  text.innerHTML =    "Happy Birthday Mas Ipan ✦";  text.style.left =    (-20 + (i * 8)) + "vw";  text.style.top =    (i * 8) + "vh";  text.style.fontSize =    (24 + Math.random()*10) + "px";  text.style.animationDuration =    (12 + Math.random()*4) + "s";  text.style.animationDelay =    Math.random()*3 + "s";  neonBg.appendChild(text);}const music =  document.getElementById("bgMusic");document.body.addEventListener("click", ()=>{  music.play();},{ once:true });</script></body></html>
